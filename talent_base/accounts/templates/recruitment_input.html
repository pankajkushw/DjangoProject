<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="/static/style.css">
    <title>PMAYG-Surajpur - Recruitment Input</title>
</head>

<body>
    <div class="form-container" style="max-width: 600px; margin: 40px auto; padding: 20px;">
        <h2>Candidate Registration</h2>
        
        <!-- The form action points to itself, method must be POST -->
        <!-- enctype is mandatory because your view handles request.FILES -->
        <form method="POST" enctype="multipart/form-data">
            <!-- Django security token -->
            {% csrf_token %}
            
            <!-- Render the form fields as paragraph elements -->
            {{ form.as_p }}
            
            <button type="submit" style="margin-top: 20px; padding: 10px 20px;">Submit</button>
        </form>
    </div>
    
    <script src="/static/main.js"></script>
</body>

</html>
